name: Benchmark and Store as Git Notes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # every Sunday at 00:00 UTC
  workflow_dispatch: # allow manual triggering

env:
  PUB_CACHE_PATH: ~/.pub-cache

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache Dart Dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.PUB_CACHE_PATH }}
          key: ${{ runner.os }}-pub-cache-stable
          restore-keys: ${{ runner.os }}-pub-cache-

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Fetch Existing Benchmark Data
        run: git fetch origin refs/notes/benchmarks:refs/notes/benchmarks

      # The benchmark package depends on relic_native, whose build hook
      # compiles the Zig library on a source checkout. The version comes
      # from packages/relic_native/build.zig.zon.
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install Dependencies
        run: dart pub get

      # `dart compile exe` refuses a package graph with build hooks.
      - name: Run Benchmark
        id: run-benchmark
        working-directory: packages/benchmark
        run: |
          dart build cli --target bin/benchmark.dart
          ./build/cli/linux_x64/bundle/bin/benchmark run --store-in-git-notes --verbose

      - name: Push Benchmark Data
        # This step runs only if the pull request is NOT from a fork.
        # Otherwise it would fail as it requires git push access
        if: github.event.pull_request.head.repo.fork == false
        run: git push origin refs/notes/benchmarks # This
