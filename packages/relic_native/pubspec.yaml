name: relic_native
description: A Relic adapter backed by a Zig HTTP server on native I/O threads.
version: 2.0.0-rc.2
repository: https://github.com/serverpod/relic
homepage: https://docs.dartrelic.dev/
topics:
  - server
  - web
  - backend
  - http

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  code_assets: ^2.0.0
  ffi: ^2.1.0
  hooks: ^2.0.0
  relic_core: ^2.0.0-rc.2
  stream_channel: ^2.1.1
  web_socket: ^1.0.1

dev_dependencies:
  http: ^1.5.0
  lints: ^6.0.0
  path: ^1.9.0
  relic_io:
    path: ../relic_io
  serverpod_lints: ">=3.0.0 <5.0.0"
  test: ^1.26.2
  test_utils:
    path: ../test_utils
